<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}trade_pl{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="/">trade_<span>pl</span></a>
      <nav class="nav">
        <a href="/">Leaderboard</a>
        <a href="/horizons">Horizons</a>
        <a href="/sectors">Sectors</a>
        <a href="/compare">Compare</a>
        <span class="badge">research only · not advice</span>
      </nav>
    </header>
    {% block content %}{% endblock %}
    <p class="disclaimer">
      Rankings are deterministic model candidates from historical price/volume factors,
      with optional news and financials from public market data. Not financial advice.
    </p>
  </div>
</body>
</html>
