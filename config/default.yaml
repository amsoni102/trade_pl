metrics_version: metrics_v1

# Full multi-market catalog (~1300: USA, Europe, Japan, China, Asia, …).
# Cap with --universe-size / make start UNIVERSE_SIZE=N for quicker tests.
universe_size: 1200
lookback_days: 420
min_price: 5.0
min_avg_volume: 100000
min_history_days: 80

# Ranking weights (must sum ~1.0)
weights:
  return_3m: 0.35
  return_1m: 0.15
  sharpe: 0.25
  low_drawdown: 0.15
  liquidity: 0.10

# Top lists: large enough for a real research board
# Ensure every top-tier name gets dashboard + drawdown + 5y forecast plots
plot_top_k: 300
enrich_top_k: 300
horizon_top_n: 100
sector_top_n: 50

# Parallel downloads — keep low. Yahoo shares one crumb; >4 workers → 401 Invalid Crumb.
ingest_workers: 3
ingest_min_interval: 0.4
enrich_workers: 4

paths:
  data_raw: data/raw
  data_metrics: data/metrics
  data_enrichment: data/enrichment
  # Short-lived Yahoo name→ticker query cache (not full market data)
  data_search: data/search
  plots: plots
  reports: reports
  universes: universes
