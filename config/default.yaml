metrics_version: metrics_v1

# Full multi-market catalog (~1300: USA, Europe, Japan, China, Asia, …).
# Cap with --universe-size / make start UNIVERSE_SIZE=N for quicker tests.
universe_size: 1200
lookback_days: 420
min_price: 5.0
min_avg_volume: 100000
min_history_days: 80

# Ranking weights (must sum ~1.0)
weights:
  return_3m: 0.35
  return_1m: 0.15
  sharpe: 0.25
  low_drawdown: 0.15
  liquidity: 0.10

# Top lists: large enough for a real research board
# plot_top_k: 0 = every scored symbol gets dashboard + drawdown + 5y forecast
plot_top_k: 0
enrich_top_k: 500
horizon_top_n: 150
sector_top_n: 80

# Parallel downloads — keep low. Yahoo shares one crumb; >4 workers → 401/429.
ingest_workers: 3
ingest_min_interval: 0.4
# Enrichment hits info+news+financials per name — stay slower than ingest.
enrich_workers: 2
enrich_min_interval: 0.85
# Reuse usable enrichment JSON newer than this (hours) to avoid Yahoo 429 storms.
enrich_max_age_hours: 18
# Cap live Yahoo refreshes per pipeline run (rest fill on ticker open).
enrich_fetch_limit: 60

paths:
  data_raw: data/raw
  data_metrics: data/metrics
  data_enrichment: data/enrichment
  # Short-lived Yahoo name→ticker query cache (not full market data)
  data_search: data/search
  # Official SEC EDGAR 10-K / 10-Q / 8-K links (PDF/HTML)
  data_filings: data/filings
  plots: plots
  reports: reports
  universes: universes
