metrics_version: metrics_v1

# Full curated multi-sector universe (~1000). Cap with --universe-size only for quick tests.
universe_size: 1000
lookback_days: 420
min_price: 5.0
min_avg_volume: 250000
min_history_days: 80

# Ranking weights (must sum ~1.0)
weights:
  return_3m: 0.35
  return_1m: 0.15
  sharpe: 0.25
  low_drawdown: 0.15
  liquidity: 0.10

# Top lists: large enough for a real research board
plot_top_k: 150
enrich_top_k: 300
horizon_top_n: 100
sector_top_n: 50

# Parallel downloads (Yahoo rate limits — raise carefully)
ingest_workers: 10
enrich_workers: 6

paths:
  data_raw: data/raw
  data_metrics: data/metrics
  data_enrichment: data/enrichment
  plots: plots
  reports: reports
  universes: universes
