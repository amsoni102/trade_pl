<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}trade_pl{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="/">trade_<span>pl</span></a>
      <form class="nav-search" action="/search" method="get" role="search">
        <input
          type="search"
          name="q"
          placeholder="Search stock…"
          aria-label="Search stocks by name or ticker"
          autocomplete="off"
        />
        <button type="submit">Search</button>
      </form>
      <nav class="nav">
        <a href="/floor">Floor</a>
        <a href="/">Leaderboard</a>
        <a href="/search">Search</a>
        <a href="/news">News</a>
        <a href="/horizons">Horizons</a>
        <a href="/sectors">Sectors</a>
        <a href="/compare">Compare</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
